[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accelerator-bench"
version = "0.1.0"
description = "Measured AI operation and compiler performance experiments"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "numpy>=1.26", "matplotlib>=3.8", "nvidia-ml-py>=12"]

[project.optional-dependencies]
dev = ["pytest>=8"]
hub = ["qai-hub", "onnx>=1.16"]

[project.scripts]
accelerator-bench = "accelerator_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
